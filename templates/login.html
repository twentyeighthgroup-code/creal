 <form method="POST">
        <div class="form-group">
          <label for="username">{% if session.get('language', 'ru') == 'ru' %}Имя пользователя{% else %}Username{% endif %}</label>
          <input type="text" id="username" name="username" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="password">{% if session.get('language', 'ru') == 'ru' %}Пароль{% else %}Password{% endif %}</label>
          <input type="password" id="password" name="password" class="form-control" required>
        </div>
         <div class="form-group">
          <label for="language">{% if session.get('language', 'ru') == 'ru' %}Язык{% else %}Language{% endif %}</label>
          <select id="language" name="language" class="form-control" required>
            <option value="ru">{% if session.get('language', 'ru') == 'ru' %}Русский{% else %}Russian{% endif %}</option>
            <option value="en">{% if session.get('language', 'ru') == 'ru' %}Английский{% else %}English{% endif %}</option>
          </select>
        </div>
        <button type="submit" class="btn">{% if session.get('language', 'ru') == 'ru' %}Зарегистрироваться{% else %}Sign Up{% endif %}</button>
      </form>
      <p style="margin-top: 1.5rem; color: var(--text-gray);">{% if session.get('language', 'ru') == 'ru' %}Уже есть аккаунт? <a href="/" style="color: var(--accent-blue);">Войти</a>{% else %}Already have an account? <a href="/" style="color: var(--accent-blue);">Log In</a>{% endif %}</p>
