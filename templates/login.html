<!DOCTYPE html>
<html lang="{{ session.get('language', 'ru') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creal - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --primary-dark: #001f3f; --accent-blue: #4cc9f0; --accent-gold: #ffcc33; --glass-bg: rgba(0, 30, 60, 0.7); --glass-border: 1px solid rgba(255, 255, 255, 0.1); }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, var(--primary-dark), #002b5c); color: white; min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
    .card { background: var(--glass-bg); backdrop-filter: blur(16px); border: var(--glass-border); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .logo-img { width: 80px; height: 80px; margin-bottom: 1.5rem; border-radius: 15px; border: 2px solid var(--accent-gold); }
    .form-group { margin-bottom: 1.5rem; text-align: left; }
    .form-control { width: 100%; padding: 0.9rem; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; margin-top: 5px; }
    .btn { width: 100%; padding: 1rem; background: linear-gradient(90deg, var(--accent-blue), var(--accent-gold)); border: none; border-radius: 50px; color: var(--primary-dark); font-weight: 700; cursor: pointer; }
    .error { color: #ff4d4d; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo-img">
    <h2>{% if session.get('language', 'ru') == 'ru' %}Вход{% else %}Login{% endif %}</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
    <p style="margin-top: 1.5rem; font-size: 0.9rem;">
        {% if session.get('language', 'ru') == 'ru' %}Нет аккаунта? <a href="/register" style="color: var(--accent-gold);">Регистрация</a>{% else %}No account? <a href="/register" style="color: var(--accent-gold);">Sign Up</a>{% endif %}
    </p>
  </div>
</body>
</html>
