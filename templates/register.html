<!DOCTYPE html>
<html lang="{{ session.get('language', 'ru') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creal - Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-dark: #001f3f;
      --accent-blue: #4cc9f0;
      --accent-gold: #ffcc33;
      --glass-bg: rgba(0, 30, 60, 0.7);
      --glass-border: 1px solid rgba(255, 255, 255, 0.1);
    }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, var(--primary-dark), #002b5c); color: white; min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
    .card { background: var(--glass-bg); backdrop-filter: blur(16px); border: var(--glass-border); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .logo-img { width: 80px; height: 80px; margin-bottom: 1.5rem; border-radius: 15px; border: 2px solid var(--accent-gold); }
    .form-group { margin-bottom: 1.5rem; text-align: left; }
    .form-control { width: 100%; padding: 0.9rem; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; margin-top: 5px; }
    .btn { width: 100%; padding: 1rem; background: linear-gradient(90deg, var(--accent-blue), var(--accent-gold)); border: none; border-radius: 50px; color: var(--primary-dark); font-weight: 700; cursor: pointer; transition: 0.3s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(255, 204, 51, 0.3); }
    .error { color: #ff4d4d; margin-bottom: 1rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo-img">
    <h2>{% if session.get('language', 'ru') == 'ru' %}Создать аккаунт{% else %}Create Account{% endif %}</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST">
        <div class="form-group">
          <label for="username">{% if session.get('language', 'ru') == 'ru' %}Имя пользователя{% else %}Username{% endif %}</label>
          <input type="text" id="username" name="username" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="password">{% if session.get('language', 'ru') == 'ru' %}Пароль{% else %}Password{% endif %}</label>
          <input type="password" id="password" name="password" class="form-control" required>
        </div>
         <div class="form-group">
          <label for="language">{% if session.get('language', 'ru') == 'ru' %}Язык{% else %}Language{% endif %}</label>
          <select id="language" name="language" class="form-control" required>
            <option value="ru">Русский</option>
            <option value="en">English</option>
          </select>
        </div>
        <button type="submit" class="btn">{% if session.get('language', 'ru') == 'ru' %}Зарегистрироваться{% else %}Sign Up{% endif %}</button>
    </form>
    <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-gray);">
        {% if session.get('language', 'ru') == 'ru' %}Уже есть аккаунт? <a href="/login" style="color: var(--accent-gold);">Войти</a>{% else %}Already have an account? <a href="/login" style="color: var(--accent-gold);">Log In</a>{% endif %}
    </p>
  </div>
</body>
</html>
